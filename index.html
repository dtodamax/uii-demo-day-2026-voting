const t=k=>words[lang][k]??k;
const loc=v=>typeof v==='object'?(v?.[lang]||v?.vi||v?.en||''):v;
const groups=['investor','guest','staff'];const weight={investor:50,guest:30,staff:20};
const defaultQuestions=()=>[
{id:'name',type:'short',label:{vi:'Họ và tên',en:'Full name'},required:true},
{id:'org',type:'short',label:{vi:'Đơn vị công tác',en:'Organization'},required:true},
{id:'role',type:'role',label:{vi:'Nhóm người tham gia',en:'Participant group'},required:true},
{id:'project',type:'project',label:{vi:'Chọn dự án',en:'Choose a startup'},required:true}
];
const defaultProjects=()=>Array.from({length:12},(_,i)=>({id:'p'+(i+1),name:'DEMO '+String(i+1).padStart(2,'0'),logo:'',mark:['N','P','◈','V','pl','A','E','M','S','G','F','Q'][i],color:COLORS[i]}));
const defaultSettings=()=>({status:'waiting',projects:defaultProjects(),questions:defaultQuestions()});
function mockVotes(){return Array.from({length:80},(_,i)=>{let role=i<14?'investor':i<64?'guest':'staff',p=1+((i*i+3*i+Math.floor(i/7))%12);return{id:'sample-'+i,browser_id:'sample-'+i,project_id:'p'+p,role,voter_name:'Khách mẫu '+String(i+1).padStart(2,'0'),organization:'Đơn vị mẫu '+(i%9+1),answers:{name:'Khách mẫu '+String(i+1).padStart(2,'0'),org:'Đơn vị mẫu '+(i%9+1),role,project:'p'+p},created_at:new Date(Date.UTC(2026,11,2,12,35,Math.floor(i*5))).toISOString()}})}
let demo=store.get(KEY+'-demo',null)||{settings:defaultSettings(),votes:mockVotes()};
let settings=LIVE?defaultSettings():demo.settings,votes=LIVE?[]:demo.votes,route=location.hash==='#admin'?'admin':'vote',tab='dashboard',authed=false,loading=LIVE,error='',draft={},filter='',filterRole='',busy=false,modalReturn=null;
let session=null;try{session=JSON.parse(sessionStorage.getItem(KEY+'-auth')||'null')}catch{}
let browserID,storageOK=true;try{browserID=store.get(KEY+'-browser',null)||crypto.randomUUID();store.set(KEY+'-browser',browserID)}catch{storageOK=false;browserID=''}
let receipt=store.get(KEY+(LIVE?'-receipt-live':'-receipt-demo'),null);if(receipt&&receipt.source!==(LIVE?CONFIG.supabaseUrl:'demo'))receipt=null;
function persistDemo(){demo={settings,votes};store.set(KEY+'-demo',demo)}
function logo(p){return `<span class="logo" style="--accent:${esc(p.color||'#00d8ce')}">${p.logo?`<img src="${esc(p.logo)}" alt="${esc(p.name)}" loading="lazy">`:esc(p.mark||p.name.slice(0,2))}</span>`}
function statusTag(){return `<span class="status ${settings.status==='open'?'open':''}"><span class="dot"></span>${t(settings.status==='open'?'open':settings.status==='closed'?'closed':'waiting')}</span>`}
function shell(content){document.documentElement.lang=lang;$('#app').innerHTML=`<header class="topbar"><a class="back-event" href="https://uii.ueh.edu.vn/en/demo-day-2026/">← Demo Day 2026</a><div class="top-actions"><button class="linkbtn" data-action="${route==='admin'?'route-vote':'route-admin'}">${t(route==='admin'?'voter':'admin')}</button><div class="lang" aria-label="Language"><button data-lang="vi" class="${lang==='vi'?'active':''}" aria-pressed="${lang==='vi'}">VI</button><button data-lang="en" class="${lang==='en'?'active':''}" aria-pressed="${lang==='en'}">EN</button></div></div></header>${!LIVE&&route==='admin'?`<div class="demo-strip"><span>${t('demo')}</span><button class="linkbtn" data-action="guide">${t('guide')} ↗</button></div>`:''}<main>${content}</main><footer><span>${t('footer')}</span><span>${!LIVE?t('demo'):t('private')}</span></footer>`}
function render(){if(loading){shell(`<div class="loading">${t('load')}</div>`);return}if(error){shell(`<div class="empty"><h2>${t('network')}</h2><button class="btn primary" data-action="retry">${t('retry')}</button></div>`);return}route==='admin'?renderAdmin():renderVote()}
function renderField(q){let value=draft[q.id]??'';let required=q.required?' <span class="req">*</span>':'';let label=esc(loc(q.label));if(q.type==='role')return `<div class="field"><span class="field-title">${label}${required}</span><div class="rolechoices">${groups.map(g=>`<label class="roleopt"><input type="radio" name="role" data-answer="role" value="${g}" ${value===g?'checked':''}>${t(g)}<b>${weight[g]}%</b></label>`).join('')}</div></div>`;
if(q.type==='single'||q.type==='multi')return `<fieldset style="border:0;padding:0;margin:0 0 20px"><legend class="field-title">${label}${required}</legend>${(q.options||[]).map((o,i)=>`<label class="choice"><input type="${q.type==='multi'?'checkbox':'radio'}" name="${esc(q.id)}" data-answer="${esc(q.id)}" value="${i}" ${(q.type==='multi'?Array.isArray(value)&&value.includes(String(i)):String(value)===String(i))?'checked':''}>${esc(loc(o))}</label>`).join('')}</fieldset>`;
return `<label class="field"><span>${label}${required}</span>${q.type==='long'?`<textarea data-answer="${esc(q.id)}" maxlength="2000" placeholder="${t('placeholder')}">${esc(value)}</textarea>`:`<input data-answer="${esc(q.id)}" maxlength="200" autocomplete="${q.id==='name'?'name':q.id==='org'?'organization':'off'}" value="${esc(value)}" placeholder="${t('placeholder')}">`}</label>`}

function totals(){return Object.fromEntries(groups.map(g=>[g,votes.filter(v=>v.role===g).length]))}
function ranking(){let total=totals();let rows=settings.projects.map(p=>{let counts=Object.fromEntries(groups.map(g=>[g,votes.filter(v=>v.role===g&&v.project_id===p.id).length]));return{...p,counts,total:Object.values(counts).reduce((a,b)=>a+b,0),score:groups.reduce((s,g)=>s+(total[g]?weight[g]*counts[g]/total[g]:0),0)}}).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));let prev=null,rank=0;rows.forEach((r,i)=>{if(prev===null||Math.abs(prev-r.score)>1e-9)rank=i+1;r.rank=rank;prev=r.score});return rows}

function matchedVotes(){let q=filter.toLocaleLowerCase();return [...votes].filter(v=>(!filterRole||v.role===filterRole)&&[v.voter_name,v.organization,settings.projects.find(p=>p.id===v.project_id)?.name].some(x=>(x||'').toLocaleLowerCase().includes(q))).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}

utton><button class="iconbtn" data-delete-p="${esc(p.id)}" ${structureLocked()?'disabled':''}>${t('remove')}</button></div></div>`).join('')}</div></section><section class="panel"><h3>${t('guideTitle')}</h3><p class="muted">${t(LIVE?'authenticity':'demoAdminNote')}</p><button class="btn purple" data-action="guide">${t('guide')} ↗</button></section>`}
function openModal(html,wide=false){modalReturn=document.activeElement;$('#modal-root').innerHTML=`<div class="modalshade"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" data-action="close-modal" aria-label="${t('close')}">×</button>${html}</section></div>`;let first=$('.modal input,.modal textarea,.modal button:not(.close)');first?.focus()}

async function sendVote(){if(busy)return;busy=true;const btn=$('[data-action="send-vote"]');btn.disabled=true;btn.textContent=t('busy');try{if(LIVE){await api('/rest/v1/rpc/dd_cast_vote',{method:'POST',body:{p_browser_id:browserID,p_project_id:draft.project,p_role:draft.role,p_answers:draft}},false)}else{let latest=store.get(KEY+'-demo',demo);if(latest.settings.status!=='open')throw Error('VOTING_CLOSED');if(latest.votes.some(v=>v.browser_id===browserID))throw Error('ALREADY_VOTED');votes=latest.votes;votes.push({id:crypto.randomUUID(),browser_id:browserID,project_id:draft.project,role:draft.role,voter_name:draft.name||'',organization:draft.org||'',answers:{...draft},created_at:new Date().toISOString()});settings=latest.settings;persistDemo()}
receipt={name:settings.projects.find(p=>p.id===draft.project)?.name||draft.project,source:LIVE?CONFIG.supabaseUrl:'demo'};try{store.set(KEY+(LIVE?'-receipt-live':'-receipt-demo'),receipt)}catch{}busy=false;closeModal();render();window.scrollTo({top:0,behavior:'smooth'})}catch(e){busy=false;btn.disabled=false;btn.textContent=t('send');$('#send-error').innerHTML=`<p class="notice error">${esc(errorMessage(e))}</p>`}}
function errorMessage(e){let m=e.message||'';return t(m.includes('ALREADY_VOTED')?'duplicate':m.includes('VOTING_CLOSED')?'notOpen':m.includes('STRUCTURE_LOCKED')?'locked':m.includes('INVALID')?'invalid':m.includes('permission')||m.includes('FORBIDDEN')?'accessDenied':'network')}
let editedQuestion=null,editedProject=null,editLogo='';
function questionModal(id){editedQuestion=id||null;let q=settings.questions.find(q=>q.id===id)||{type:'short',label:{vi:'',en:''},required:false,options:[]};let locked=['role','project'].includes(q.type)||structureLocked();openModal(`<h2 id="modal-title">${t(id?'editQuestion':'addQuestion')}</h2><form id="question-form"><div class="split"><label class="field"><span>${t('viLabel')}</span><input name="vi" required maxlength="250" value="${esc(q.label.vi)}"></label><label class="field"><span>${t('enLabel')}</span><input name="en" required maxlength="250" value="${esc(q.label.en)}"></label></div><label class="field"><span>${t('questionType')}</span><select name="type" id="question-type" ${locked?'disabled':''}>${['role','project'].includes(q.type)?`<option value="${q.type}">${t('system')}</option>`:['short','long','single','multi'].map(x=>`<option value="${x}" ${q.type===x?'selected':''}>${t(x)}</option>`).join('')}</select></label><label class="choice"><input type="checkbox" name="required" ${q.required?'checked':''} ${locked?'disabled':''}>${t('mandatory')}</label><label class="field" id="question-options" style="display:${['single','multi'].includes(q.type)?'block':'none'}"><span>${t('options')}</span><textarea name="options" ${structureLocked()?'disabled':''}>${esc((q.options||[]).map(o=>o.vi+' | '+o.en).join('\n'))}</textarea></label><p id="edit-error" class="errorText" aria-live="polite"></p><div class="actions"><button class="btn" type="button" data-action="close-modal">${t('cancel')}</button><button class="btn primary" type="submit">${t('save')}</button></div></form>`,true)}
function projectModal(id){editedProject=id||null;let p=settings.projects.find(p=>p.id===id)||{name:'',logo:''};editLogo=p.logo||'';openModal(`<h2 id="modal-title">${t(id?'edit':'addProject')}</h2><form id="project-form"><label class="field"><span>${t('projectName')}</span><input name="name" required maxlength="80" value="${esc(p.name)}" ${structureLocked()?'disabled':''}></label><label class="field"><span>${t('logo')}</span><input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="logo-preview">${editLogo?`<img src="${esc(editLogo)}" style="max-width:150px;max-height:100px;background:white" alt="Logo">`:''}</div><button type="button" class="linkbtn" data-action="remove-logo">${t('removeLogo')}</button><p class="legalnote">${t('logoNote')}</p><p id="edit-error" class="errorText" aria-live="polite"></p><div class="actions"><button type="button" class="btn" data-action="close-modal">${t('cancel')}</button><button type="submit" class="btn primary">${t('save')}</button></div></form>`)}
async function saveSettings(next){if(LIVE){await api('/rest/v1/rpc/dd_save_settings',{method:'POST',body:{p_data:next}},true);settings=next}else{settings=next;let latest=store.get(KEY+'-demo',demo);votes=latest.votes;persistDemo()}render()}
async function saveQuestion(form){if(busy)return;let data=new FormData(form),old=settings.questions.find(q=>q.id===editedQuestion);let type=(old&&(['role','project'].includes(old.type)||structureLocked()))?old.type:data.get('type');let options=structureLocked()?old?.options:(data.get('options')||'').split('\n').filter(x=>x.trim()).map(x=>{let v=x.split('|');return{vi:v[0]?.trim()||'',en:v.slice(1).join('|').trim()}});if(!data.get('vi')?.trim()||!data.get('en')?.trim()||(['single','multi'].includes(type)&&(options.length<2||options.some(o=>!o.vi||!o.en)))){$('#edit-error').textContent=t('qNeed');return}let q={id:old?.id||'q_'+crypto.randomUUID().slice(0,8),type,label:{vi:data.get('vi').trim(),en:data.get('en').trim()},required:(old&&(['role','project'].includes(type)||structureLocked()))?old.required:data.has('required')};if(['single','multi'].includes(type))q.options=options;let next=structuredClone(settings);if(old)next.questions[next.questions.findIndex(x=>x.id===old.id)]=q;else next.questions.push(q);await commitModal(next)}
async function saveProject(form){let data=new FormData(form),old=settings.projects.find(p=>p.id===editedProject),name=structureLocked()?old.name:data.get('name')?.trim();if(!name)return;let next=structuredClone(settings),p={id:old?.id||'p_'+crypto.randomUUID().slice(0,8),name,logo:editLogo,mark:old?.mark||name.slice(0,2).toUpperCase(),color:old?.color||COLORS[next.projects.length%12]};if(old)next.projects[next.projects.findIndex(x=>x.id===old.id)]=p;else next.projects.push(p);await commitModal(next)}
async function commitModal(next){if(busy)return;busy=true;document.querySelectorAll('.modal button').forEach(b=>b.disabled=true);try{await saveSettings(next);busy=false;closeModal();toast(t('saved'))}catch(e){busy=false;document.querySelectorAll('.modal button').forEach(b=>b.disabled=false);let el=$('#edit-error');if(el)el.textContent=errorMessage(e);else toast(errorMessage(e))}}
function confirmChange(kind,id){if(structureLocked()){toast(t('locked'));return}if(kind==='questions'&&['role','project'].includes(settings.questions.find(q=>q.id===id)?.type)){toast(t('cannotDelete'));return}openModal(`<h2 id="modal-title">${t('deleteTitle')}</h2><p>${t('deleteDesc')}</p><div class="actions"><button class="btn" data-action="close-modal">${t('cancel')}</button><button class="btn danger" id="delete-confirm">${t('remove')}</button></div>`);$('#delete-confirm').onclick=async()=>{let next=structuredClone(settings);next[kind]=next[kind].filter(x=>x.id!==id);await commitModal(next)}}
async function moveItem(kind,id,direction){if(structureLocked())return;let next=structuredClone(settings),i=next[kind].findIndex(x=>x.id===id),j=i+Number(direction);if(i<0||j<0||j>=next[kind].length)return;[next[kind][i],next[kind][j]]=[next[kind][j],next[kind][i]];try{await saveSettings(next)}catch(e){toast(errorMessage(e))}}
function viewVote(id){let v=votes.find(v=>v.id===id);if(!v)return;openModal(`<h2 id="modal-title">${t('details')}</h2><p class="muted">${timeFmt(v.created_at)} · UTC+7</p>${settings.questions.map(q=>{let val=v.answers[q.id];if(q.id==='role')val=t(v.role);if(q.id==='project')val=settings.projects.find(p=>p.id===v.project_id)?.name||v.project_id;if(['single','multi'].includes(q.type)){val=(Array.isArray(val)?val:[val]).map(n=>loc(q.options?.[Number(n)])||n).join(', ')}return `<div style="border-top:1px solid var(--line);padding:12px 0"><small>${esc(loc(q.label))}</small><div>${esc(val||'—')}</div></div>`}).join('')}<div class="actions"><button class="btn primary" data-action="close-modal">${t('close')}</button></div>`)}
async function refreshToken(){if(!session?.refresh_token)throw Error('FORBIDDEN');let r=await fetch(CONFIG.supabaseUrl.replace(/\/$/,'')+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:CONFIG.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)throw Error('FORBIDDEN');session=await r.json();sessionStorage.setItem(KEY+'-auth',JSON.stringify(session))}
async function api(path,options={},admin=false,retry=true){let h={apikey:CONFIG.supabaseKey,'Content-Type':'application/json'};if(admin){if(!session?.access_token)throw Error('FORBIDDEN');h.Authorization='Bearer '+session.access_token}let r=await fetch(CONFIG.supabaseUrl.replace(/\/$/,'')+path,{...options,headers:{...h,...options.headers},body:options.body?JSON.stringify(options.body):undefined});if(r.status===401&&admin&&retry){await refreshToken();return api(path,options,admin,false)}let data=await r.json().catch(()=>null);if(!r.ok)throw Error(data?.message||data?.error_description||'NETWORK');return data}

async function reload(){try{if(LIVE){await loadPublic();if(authed)await loadVotes()}else{let s=store.get(KEY+'-demo',demo);settings=s.settings;votes=s.votes}error='';loading=false;render()}catch(e){loading=false;error=e.message;render()}}
function download(content,name,mime){let blob=new Blob([content],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function action(name){if(name==='route-admin'||name==='route-vote'){route=name==='route-admin'?'admin':'vote';location.hash=route==='admin'?'admin':'vote';render();window.scrollTo(0,0);return}if(name==='close-modal'){closeModal();return}if(name==='guide'){guide();return}if(name==='demo-login'){authed=true;render();return}if(name==='logout'){authed=false;session=null;sessionStorage.removeItem(KEY+'-auth');votes=LIVE?[]:votes;render();return}if(name==='vote'){showVote();return}if(name==='send-vote'){await sendVote();return}if(name==='retry'||name==='refresh'){await reload();return}if(name==='add-question'){questionModal();return}if(name==='add-project'){projectModal();return}if(name==='remove-logo'){editLogo='';$('#logo-preview').innerHTML='';return}if(name==='download-sql'){download($('#setup-sql').textContent,'DemoDay_2026_Setup.sql','text/plain');return}if(name==='reset-mine'&&!LIVE){let latest=store.get(KEY+'-demo',demo);votes=latest.votes.filter(v=>v.browser_id!==browserID);settings=latest.settings;persistDemo();receipt=null;localStorage.removeItem(KEY+'-receipt-demo');draft={};render();return}if(name==='toggle-status'){if(!settings.projects.length){toast(t('emptyProject'));return}let opening=settings.status!=='open';openModal(`<h2 id="modal-title">${t('changeStatus')}</h2><p>${t(opening?'openConfirm':'closeConfirm')}</p><div class="actions"><button class="btn" data-action="close-modal">${t('cancel')}</button><button class="btn primary" id="status-confirm">${t('yes')}</button></div>`);$('#status-confirm').onclick=async()=>{let next=structuredClone(settings);next.status=opening?'open':'closed';await commitModal(next)}}}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b||b.disabled)return;try{if(b.dataset.lang){if(b.dataset.lang===lang)return;lang=b.dataset.lang;store.set(KEY+'-lang',lang);closeModal();render();return}if(b.dataset.action){await action(b.dataset.action);return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.project){draft.project=b.dataset.project;render();document.querySelector(`[data-project="${CSS.escape(draft.project)}"]`)?.focus();return}if(b.dataset.editQ){questionModal(b.dataset.editQ);return}if(b.dataset.editP){projectModal(b.dataset.editP);return}if(b.dataset.deleteQ){confirmChange('questions',b.dataset.deleteQ);return}if(b.dataset.deleteP){confirmChange('projects',b.dataset.deleteP);return}if(b.dataset.qMove){await moveItem('questions',b.dataset.qMove,b.dataset.direction);return}if(b.dataset.pMove){await moveItem('projects',b.dataset.pMove,b.dataset.direction);return}if(b.dataset.viewVote){viewVote(b.dataset.viewVote);return}}catch(err){toast(errorMessage(err))}});
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.answer){let q=settings.questions.find(q=>q.id===el.dataset.answer);if(q?.type==='multi'){draft[q.id]=[...document.querySelectorAll(`[data-answer="${CSS.escape(q.id)}"]:checked`)].map(x=>x.value)}else draft[el.dataset.answer]=el.value}if(el.id==='ballot-search'){filter=el.value;$('#ballot-rows').innerHTML=ballotRows()}});
document.addEventListener('change',async e=>{let el=e.target;if(el.id==='ballot-role'){filterRole=el.value;$('#ballot-rows').innerHTML=ballotRows()}if(el.id==='question-type')$('#question-options').style.display=['single','multi'].includes(el.value)?'block':'none';if(el.id==='logo-file'){let file=el.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>250*1024){$('#edit-error').textContent=t('validLogo');el.value='';return}let reader=new FileReader();reader.onload=()=>{editLogo=reader.result;$('#logo-preview').innerHTML=`<img src="${esc(editLogo)}" style="max-width:150px;max-height:100px;background:white" alt="Logo">`;$('#edit-error').textContent=''};reader.readAsDataURL(file)}});
document.addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='login-form'){let form=e.target,data=new FormData(form),b=form.querySelector('button[type=submit]');b.disabled=true;try{await authenticate(data.get('email'),data.get('password'))}catch(err){session=null;sessionStorage.removeItem(KEY+'-auth');$('#login-error').textContent=t('loginError');b.disabled=false}}if(e.target.id==='question-form')await saveQuestion(e.target);if(e.target.id==='project-form')await saveProject(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('.modal')){let nodes=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not(:disabled),.modal select:not(:disabled),.modal textarea:not(:disabled),.modal a[href]')].filter(el=>el.getClientRects().length);let first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if(e.target.matches('[data-project]')&&['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let nodes=[...document.querySelectorAll('[data-project]')],i=nodes.indexOf(e.target),d=['ArrowRight','ArrowDown'].includes(e.key)?1:-1;let target=nodes[(i+d+nodes.length)%nodes.length];target.click();target.focus()}});
window.addEventListener('hashchange',()=>{route=location.hash==='#admin'?'admin':'vote';render()});
window.addEventListener('storage',e=>{if(!LIVE&&e.key===KEY+'-demo'){let latest=store.get(KEY+'-demo',demo);settings=latest.settings;votes=latest.votes;render()}if(e.key===KEY+(LIVE?'-receipt-live':'-receipt-demo')){receipt=store.get(e.key,null);render()}});
async function init(){if(LIVE){try{await loadPublic();if(session){try{let ok=await api('/rest/v1/rpc/dd_is_admin',{method:'POST',body:{}},true);if(ok){authed=true;await loadVotes()}}catch{session=null;sessionStorage.removeItem(KEY+'-auth')}}}catch(e){error=e.message}}loading=false;render()}
setInterval(async()=>{if(!LIVE||document.hidden||busy||$('.modal'))return;try{let old=JSON.stringify(settings);await loadPublic();if(authed&&route==='admin'){await loadVotes();if(tab==='dashboard')render()}else if(old!==JSON.stringify(settings))render()}catch{}},7000);
init();
</script>
<script id="setup-sql" type="text/plain">
-- UII Demo Day 2026 | Run once in a NEW Supabase project's SQL Editor.
-- After creating an admin in Authentication > Users, execute:
-- insert into public.dd_admins(user_id)
-- select id from auth.users where email = 'YOUR_ADMIN_EMAIL';
-- Keep voter signup disabled unless independently needed. Never expose a service_role key.
begin;
create table public.dd_admins(user_id uuid primary key references auth.users(id) on delete cascade);
create table public.dd_settings(id boolean primary key default true check(id), data jsonb not null);
create table public.dd_votes(
 id uuid primary key default gen_random_uuid(),
 browser_id uuid not null unique,
 project_id text not null,
 role text not null check(role in ('investor','guest','staff')),
 voter_name text not null default '', organization text not null default '',
 answers jsonb not null, created_at timestamptz not null default now()
);
alter table public.dd_admins enable row level security;
alter table public.dd_settings enable row level security;
alter table public.dd_votes enable row level security;
revoke all on public.dd_admins,public.dd_settings,public.dd_votes from anon,authenticated;
create function public.dd_is_admin() returns boolean language sql stable security definer
set search_path=public,pg_temp as $$
 select exists(select 1 from public.dd_admins where user_id=auth.uid());
$$;
revoke all on function public.dd_is_admin() from public;
grant execute on function public.dd_is_admin() to authenticated;
grant select on public.dd_votes to authenticated;
create policy dd_admin_ballots on public.dd_votes for select to authenticated using(public.dd_is_admin());

-- Initial configuration is inserted here.
insert into public.dd_settings(id,data) values(true,'{"status": "waiting", "projects": [{"id": "p1", "name": "DEMO 01", "logo": "", "mark": "N", "color": "#00d8ce"}, {"id": "p2", "name": "DEMO 02", "logo": "", "mark": "P", "color": "#b28bff"}, {"id": "p3", "name": "DEMO 03", "logo": "", "mark": "◈", "color": "#6aaeff"}, {"id": "p4", "name": "DEMO 04", "logo": "", "mark": "V", "color": "#f1b85b"}, {"id": "p5", "name": "DEMO 05", "logo": "", "mark": "pl", "color": "#55dfb0"}, {"id": "p6", "name": "DEMO 06", "logo": "", "mark": "A", "color": "#fe9eca"}, {"id": "p7", "name": "DEMO 07", "logo": "", "mark": "E", "color": "#84bfff"}, {"id": "p8", "name": "DEMO 08", "logo": "", "mark": "M", "color": "#adce68"}, {"id": "p9", "name": "DEMO 09", "logo": "", "mark": "S", "color": "#e4a36b"}, {"id": "p10", "name": "DEMO 10", "logo": "", "mark": "G", "color": "#b8a5ff"}, {"id": "p11", "name": "DEMO 11", "logo": "", "mark": "F", "color": "#58d7eb"}, {"id": "p12", "name": "DEMO 12", "logo": "", "mark": "Q", "color": "#e7cf78"}], "questions": [{"id": "name", "type": "short", "label": {"vi": "Họ và tên", "en": "Full name"}, "required": true}, {"id": "org", "type": "short", "label": {"vi": "Đơn vị công tác", "en": "Organization"}, "required": true}, {"id": "role", "type": "role", "label": {"vi": "Nhóm người tham gia", "en": "Participant group"}, "required": true}, {"id": "project", "type": "project", "label": {"vi": "Chọn dự án", "en": "Choose a startup"}, "required": true}]}'::jsonb);

create function public.dd_public_config() returns jsonb language sql stable security definer
set search_path=public,pg_temp as $$ select data from public.dd_settings where id=true; $$;
revoke all on function public.dd_public_config() from public;
grant execute on function public.dd_public_config() to anon,authenticated;

create function public.dd_answer_valid(q jsonb,v jsonb) returns boolean
language plpgsql immutable set search_path=public,pg_temp as $$
declare ty text:=q->>'type'; n integer; x text;
begin
 if v is null or v='null'::jsonb or v='""'::jsonb then return not coalesce((q->>'required')::boolean,false); end if;
 if ty in ('short','long','role','project') then
   if jsonb_typeof(v)<>'string' then return false; end if;
   if length(trim(v#>>'{}'))=0 then return not coalesce((q->>'required')::boolean,false); end if;
   return length(v#>>'{}')<=case when ty='long' then 2000 else 200 end;
 elsif ty='single' then
   if jsonb_typeof(v)<>'string' or (v#>>'{}') !~ '^[0-9]{1,3}$' then return false; end if;
   n:=(v#>>'{}')::integer; return n>=0 and n<jsonb_array_length(q->'options');
 elsif ty='multi' then
   if jsonb_typeof(v)<>'array' then return false; end if;
   if jsonb_array_length(v)=0 then return not coalesce((q->>'required')::boolean,false); end if;
   if jsonb_array_length(v)>jsonb_array_length(q->'options') then return false; end if;
   for x in select jsonb_array_elements_text(v) loop
    if x !~ '^[0-9]{1,3}$' then return false; end if;
    n:=x::integer; if n<0 or n>=jsonb_array_length(q->'options') then return false; end if;
   end loop;
   if (select count(distinct z) from jsonb_array_elements_text(v) z)<>jsonb_array_length(v) then return false; end if;
   return true;
 end if;
 return false;
end; $$;
revoke all on function public.dd_answer_valid(jsonb,jsonb) from public;

create function public.dd_cast_vote(p_browser_id uuid,p_project_id text,p_role text,p_answers jsonb)
returns uuid language plpgsql security definer set search_path=public,pg_temp as $$
declare cfg jsonb; q jsonb; result uuid;
begin
 select data into cfg from public.dd_settings where id=true for share;
 if cfg->>'status'<>'open' then raise exception 'VOTING_CLOSED'; end if;
 if p_browser_id is null or p_role not in ('investor','guest','staff') or p_role is null
 or jsonb_typeof(p_answers)<>'object' or p_answers is null or octet_length(p_answers::text)>64000 then
 raise exception 'INVALID_BALLOT'; end if;
 if not exists(select 1 from jsonb_array_elements(cfg->'projects') p where p->>'id'=p_project_id) then raise exception 'INVALID_PROJECT'; end if;
 if (p_answers->>'role') is distinct from p_role or (p_answers->>'project') is distinct from p_project_id then raise exception 'INVALID_BALLOT'; end if;
 for q in select jsonb_array_elements(cfg->'questions') loop
  if not public.dd_answer_valid(q,p_answers->(q->>'id')) then raise exception 'INVALID_ANSWER'; end if;
 end loop;
 insert into public.dd_votes(browser_id,project_id,role,voter_name,organization,answers)
 values(p_browser_id,p_project_id,p_role,left(coalesce(p_answers->>'name',''),200),left(coalesce(p_answers->>'org',''),200),p_answers)
 returning id into result;
 return result;
exception when unique_violation then raise exception 'ALREADY_VOTED';
end; $$;
revoke all on function public.dd_cast_vote(uuid,text,text,jsonb) from public;
grant execute on function public.dd_cast_vote(uuid,text,text,jsonb) to anon,authenticated;

create function public.dd_save_settings(p_data jsonb) returns boolean
language plpgsql security definer set search_path=public,pg_temp as $$
declare old_data jsonb; q jsonb; p jsonb; c integer; a jsonb; b jsonb;
begin
 if not public.dd_is_admin() then raise exception 'FORBIDDEN'; end if;
 select data into old_data from public.dd_settings where id=true for update;
 if p_data is null or jsonb_typeof(p_data)<>'object' or octet_length(p_data::text)>6000000
 or coalesce(p_data->>'status','') not in ('waiting','open','closed')
 or jsonb_typeof(p_data->'questions') is distinct from 'array'
 or jsonb_typeof(p_data->'projects') is distinct from 'array' then raise exception 'INVALID_CONFIG'; end if;
 if jsonb_array_length(p_data->'questions')>40 or jsonb_array_length(p_data->'projects')>50 then raise exception 'INVALID_CONFIG'; end if;
 if p_data->>'status'='open' and jsonb_array_length(p_data->'projects')=0 then raise exception 'INVALID_CONFIG'; end if;
 select count(*) into c from jsonb_array_elements(p_data->'questions') x where x->>'id'='role' and x->>'type'='role' and x->'required'='true'::jsonb;
 if c<>1 then raise exception 'INVALID_ROLE_FIELD'; end if;
 select count(*) into c from jsonb_array_elements(p_data->'questions') x where x->>'id'='project' and x->>'type'='project' and x->'required'='true'::jsonb;
 if c<>1 then raise exception 'INVALID_PROJECT_FIELD'; end if;
 if (select count(distinct x->>'id') from jsonb_array_elements(p_data->'questions') x)<>jsonb_array_length(p_data->'questions')
 or (select count(distinct x->>'id') from jsonb_array_elements(p_data->'projects') x)<>jsonb_array_length(p_data->'projects') then raise exception 'INVALID_IDS'; end if;
 for q in select jsonb_array_elements(p_data->'questions') loop
  if coalesce(q->>'id','') !~ '^[a-zA-Z0-9_-]{1,80}$'
  or coalesce(q->>'type','') not in ('short','long','single','multi','role','project')
  or length(trim(coalesce(q->'label'->>'vi','')))=0 or length(trim(coalesce(q->'label'->>'en','')))=0
  or jsonb_typeof(q->'required') is distinct from 'boolean' then raise exception 'INVALID_QUESTION'; end if;
  if q->>'type'='role' and q->>'id'<>'role' or q->>'type'='project' and q->>'id'<>'project' then raise exception 'INVALID_QUESTION'; end if;
  if q->>'type' in ('single','multi') then
   if jsonb_typeof(q->'options') is distinct from 'array' then raise exception 'INVALID_OPTIONS'; end if;
   if jsonb_array_length(q->'options')<2 or jsonb_array_length(q->'options')>100 then raise exception 'INVALID_OPTIONS'; end if;
   if exists(select 1 from jsonb_array_elements(q->'options') o where length(trim(coalesce(o->>'vi','')))=0 or length(trim(coalesce(o->>'en','')))=0) then raise exception 'INVALID_OPTIONS'; end if;
  end if;
 end loop;
 for p in select jsonb_array_elements(p_data->'projects') loop
  if coalesce(p->>'id','') !~ '^[a-zA-Z0-9_-]{1,80}$' or length(trim(coalesce(p->>'name','')))=0
  or length(p->>'name')>80 or coalesce(p->>'color','') !~ '^#[0-9a-fA-F]{6}$'
  or (coalesce(p->>'logo','')<>'' and (p->>'logo') !~ '^data:image/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$')
  then raise exception 'INVALID_PROJECT'; end if;
 end loop;
 if exists(select 1 from public.dd_votes limit 1) then
  select jsonb_agg(x-'label' order by n) into a from jsonb_array_elements(old_data->'questions') with ordinality x(x,n);
  select jsonb_agg(x-'label' order by n) into b from jsonb_array_elements(p_data->'questions') with ordinality x(x,n);
  if a is distinct from b then raise exception 'STRUCTURE_LOCKED'; end if;
  select jsonb_agg(x-'logo' order by n) into a from jsonb_array_elements(old_data->'projects') with ordinality x(x,n);
  select jsonb_agg(x-'logo' order by n) into b from jsonb_array_elements(p_data->'projects') with ordinality x(x,n);
  if a is distinct from b then raise exception 'STRUCTURE_LOCKED'; end if;
 end if;
 update public.dd_settings set data=p_data where id=true;
 return true;
end; $$;
revoke all on function public.dd_save_settings(jsonb) from public;
grant execute on function public.dd_save_settings(jsonb) to authenticated;
commit;

</script>
